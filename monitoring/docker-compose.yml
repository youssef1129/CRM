services:
  prometheus:
    image: prom/prometheus:latest
    container_name: vetcrm-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - cicd-network

  grafana:
    image: grafana/grafana:latest
    container_name: vetcrm-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - cicd-network
    depends_on:
      - prometheus

networks:
  cicd-network:
    external: true
